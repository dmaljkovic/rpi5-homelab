# /etc/pihole/dnsmasq.conf
#
# Reference copy of the effective non-comment lines generated by Pi-hole v6.
# Do not edit this file directly: Pi-hole regenerates it. Change settings in
# /etc/pihole/pihole.toml or the web UI instead.
#
# The values below assume a LAN of 192.168.1.0/24 and Pi-hole on 192.168.1.10.

hostsdir=/etc/pihole/hosts
no-resolv
port=53
server=127.0.0.1#5335
cache-size=10000
localise-queries
log-queries
log-async
log-facility=/var/log/pihole/pihole.log
bogus-priv
use-stale-cache=3600
local-service
local=/home.arpa/
local=/internal/
domain=lan
local=/lan/
local=/pi.hole/
host-record=pi.hole,0.0.0.0,::
server=/test/
server=/invalid/
address=/localhost/127.0.0.1
address=/localhost/::1
server=/bind/
server=/onion/
cache-rr=ANY
filter-rr=ANY
