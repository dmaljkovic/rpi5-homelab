# /etc/unbound/unbound.conf.d/pi-hole.conf
#
# Unbound as a local DNSSEC-validating resolver for Pi-hole.
# The final configuration forwards to Cloudflare over DNS-over-TLS.
#
# After editing:
#   sudo systemctl restart unbound
#   dig +short cloudflare.com @127.0.0.1 -p 5335

server:
    # If no logfile is specified, syslog is used
    # logfile: "/var/log/unbound/unbound.log"
    verbosity: 0

    # Listen only on localhost; Pi-hole is the only client.
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # May be set to yes if you have IPv6 connectivity.
    # Note: the IPv6 forwarders below are unused while this is "no".
    do-ip6: no

    # Leave this at no unless you have native IPv6.
    prefer-ip6: no

    # Use this only when you downloaded the list of primary root servers.
    # If you use the default dns-root-data package, unbound finds it automatically.
    # root-hints: "/var/lib/unbound/root.hints"

    # Trust glue only if it is within the server's authority.
    harden-glue: yes

    # Require DNSSEC data for trust-anchored zones. If absent, the zone is BOGUS.
    harden-dnssec-stripped: yes

    # Don't use capitalization randomization; it can cause DNSSEC issues.
    use-caps-for-id: no

    # Limit UDP response size to avoid fragmentation (DNS Flag Day 2020).
    edns-buffer-size: 1232

    # Prefetch frequently queried, nearly expired entries.
    prefetch: yes

    # One thread is enough for a small network.
    num-threads: 1

    # Kernel receive buffer.
    so-rcvbuf: 1m

    # Keep local IP ranges private.
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

server:
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
    name: "."
    forward-tls-upstream: yes
    # Cloudflare DNS over TLS
    forward-addr: 2606:4700:4700::1111@853#cloudflare-dns.com
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 2606:4700:4700::1001@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
